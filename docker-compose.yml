services:

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    restart: always
    volumes:
      - ./volumes/logs:/vault/logs
      - ./volumes/file:/vault/file
      - ./volumes/config:/vault/config
    cap_add:
      - IPC_LOCK
    entrypoint: vault server -config=/vault/config/vault.json

  hashi-api:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: hashi-api-dev
    # working_dir: /opt/app
    # command: ['npm', 'run', 'start:dev']
    container_name: hashi-api
    env_file:
      - ../Sewa-Deploy/ENV/hashi-api.env
    environment:
        - loglevel=none
    volumes:
        - .:/opt/app/
        - /opt/app/node_modules
        - /opt/app/volumes
    ports:
        - "3300:8080"
    depends_on:
      - vault
    networks:
        - wallet

networks:
  wallet:
    external: false
    driver: bridge
